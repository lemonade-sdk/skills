name: AMD Skills Checks

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/amd-skills-evals.yml"
  workflow_dispatch:
    inputs:
      routing:
        description: Routing Tests
        type: boolean
        default: false
      behavioral:
        description: Behavioral Tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evals:
    name: AMD Skills Checks
    permissions:
      contents: read
      # Lets the routing and behavioral jobs trade a GitHub OIDC token for a
      # short-lived Anthropic token. A called workflow can only lower this.
      id-token: write
    uses: amd/skillscope/.github/workflows/skill-evals.yml@v0.1.3
    with:
      skill_globs: skills/*
      routing_room: all
      infra_paths: .github/workflows/amd-skills-evals.yml
      # Structural checks always run. Pull requests stop there; a dispatch
      # adds whichever graded runs were ticked.
      mode: ${{ github.event_name == 'workflow_dispatch' && (inputs.routing && inputs.behavioral && 'both' || inputs.routing && 'routing' || inputs.behavioral && 'behavioral') || 'references' }}
      api_key_secret: ""
      federation_rule_id: fdrl_01TZoKzi43MDt7ZDXsZrUCaC
      federation_organization_id: 9bdff596-1595-4140-8301-817e43ef8412
      federation_service_account_id: svac_01BYyFcLJVZBP9mzWyEYpK4t
      federation_workspace_id: wrkspc_01WQJkWdR2hbSu8a4MivL8NP
